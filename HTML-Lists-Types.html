<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Types of List</h1>

    <!-- Yeh Unordered List hai -->
    <ul>
    <li>HTML Seekhna</li>
    <li>CSS Seekhna</li>
    <li>JavaScript Seekhna</li>
    </ul>
    
    <!-- Yeh Ordered List hai -->
    <ol>
    <li>Pani garam karein</li>
    <li>Chai patti aur cheeni dalein</li>
    <li>Doodh milakar ubaalein</li>
    </ol>

     <!-- Yeh Definition List hai -->
    <dl>
    <dt>HTML</dt>
    <dd>Yeh website ka dhacha (Skeleton) banane ke kaam aata hai.</dd>

    <dt>CSS</dt>
    <dd>Yeh website ko sunder aur colorful banane ke kaam aata hai.</dd>
    </dl>
</body>
</html>
